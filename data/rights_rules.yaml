# Rule-based rights summaries. Rules are checked top to bottom; the first match wins.
# "any" matches every answer. Re-read the templates against the sources before the demo.
sources:
  - title: "US Copyright Office, Copyright Registration Guidance: Works Containing Material Generated by Artificial Intelligence (March 2023)"
    url: "https://www.copyright.gov/ai/ai_policy_guidance.pdf"
  - title: "US Copyright Office, Copyright and Artificial Intelligence, Part 2: Copyrightability (January 2025)"
    url: "https://www.copyright.gov/ai/Copyright-and-Artificial-Intelligence-Part-2-Copyrightability-Report.pdf"

questions:
  method:
    label: "How was this piece made?"
    options:
      human: "Entirely by me (traditional or digital, no AI)"
      ai_minor: "I used AI tools for minor edits (cleanup, upscaling, small fills)"
      ai_parts: "I generated parts with AI and combined or edited them"
      ai_mostly: "Mostly AI-generated from my prompts"
  modified:
    label: "Did you substantially change the AI output by hand?"
    options: {yes: "Yes", no: "No", na: "Not applicable"}
  arranged:
    label: "Is the piece your own selection or arrangement of AI-generated elements?"
    options: {yes: "Yes", no: "No", na: "Not applicable"}

rules:
  - when: {method: human}
    key: human
    status: "Likely protected"
    summary: >-
      Work you created yourself is the kind of human authorship copyright protects, and protection applies
      automatically once the work is fixed. Registering it with the US Copyright Office is optional but makes
      it easier to enforce your rights.
  - when: {method: ai_minor}
    key: ai_minor
    status: "Likely protected"
    summary: >-
      Your own creative choices remain protectable. The Copyright Office treats AI used as a tool to assist a
      human author differently from AI that generates the expressive content. Minor edits like cleanup or
      upscaling are unlikely to change your authorship, but if AI generated any new material beyond a minimal
      amount, it should be disclosed when you register.
  - when: {method: ai_parts, modified: yes}
    key: ai_parts_modified
    status: "Partly protected"
    summary: >-
      The parts you made and your substantial changes to the AI output are likely protectable. Material
      generated by AI on its own is not. When registering, describe your contribution and exclude
      AI-generated material that is more than minimal.
  - when: {method: ai_parts}
    key: ai_parts
    status: "Partly protected"
    summary: >-
      The parts you made yourself, and the way you combined them with AI-generated material, may be
      protectable. The AI-generated parts on their own are not. When registering, disclose and exclude
      AI-generated material that is more than minimal.
  - when: {method: ai_mostly, modified: yes}
    key: ai_mostly_modified
    status: "Limited protection"
    summary: >-
      The AI-generated image itself is not protectable, but your own substantial changes to it may be.
      Protection would cover only what you added or changed. Disclose the AI-generated material when
      registering.
  - when: {method: ai_mostly, arranged: yes}
    key: ai_mostly_arranged
    status: "Limited protection"
    summary: >-
      Individual AI-generated elements are not protectable, but your creative selection and arrangement of
      them may be. Protection would cover the arrangement, not the elements themselves.
  - when: {method: ai_mostly}
    key: ai_mostly
    status: "Likely not protected"
    summary: >-
      Under current Copyright Office guidance, material generated by AI from prompts is generally not
      protectable, because prompts alone usually don't give a person enough control over the result. Adding
      your own substantial changes, or a creative selection and arrangement, could change this.
